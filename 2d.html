<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Custom World — 2D Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#83c4e0;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:12px;left:12px;background:#173d3bc9;color:#fff;border-radius:12px;padding:10px 13px;font-size:13px;max-width:calc(100vw - 24px)}#hud b{font-size:17px}#hud a{color:#c8f6ff}#joy{position:fixed;bottom:24px;left:22px;width:122px;height:122px;border:2px solid #ffffff80;background:#153d4c55;border-radius:50%;touch-action:none}#stick{position:absolute;left:37px;top:37px;width:44px;height:44px;border-radius:50%;background:#eaf8ffb8;pointer-events:none}#run{position:fixed;right:24px;bottom:40px;width:78px;height:78px;border:2px solid #fff9;border-radius:50%;background:#23586bb0;color:#fff;font-weight:700;touch-action:none}#stats{font-size:12px;opacity:.9;margin-top:4px}#error{position:fixed;top:110px;left:12px;right:12px;color:white;background:#9a3434;padding:10px;border-radius:8px}#error[hidden]{display:none}@media(hover:hover) and (pointer:fine){#joy,#run{opacity:.5}}</style></head><body><canvas id="world" aria-label="Custom World 2D game"></canvas><div id="hud"><b>🌿 Custom World 2D</b><div>ต้นแบบ Isometric · โลก 600 × 600 ม.</div><div id="stats">กำลังโหลด...</div><div>WASD / ลูกศร · Shift วิ่ง · มือถือใช้จอย</div><a href="/3d.html?v=11">กลับไปทดลอง V11 แบบ 3D</a></div><div id="joy"><div id="stick"></div></div><button id="run">วิ่ง</button><div id="error" hidden></div><script src="/2d.js?v=1" defer></script></body></html>
