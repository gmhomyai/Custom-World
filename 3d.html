<!doctype html><html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Custom World — 3D Central World</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#9ed8f3}#app{width:100%;height:100%}#hud{position:fixed;top:14px;left:14px;color:white;background:#162c36bd;padding:12px 16px;border-radius:12px;max-width:300px;pointer-events:none}#hud small{display:block;line-height:1.6}#joystick{position:fixed;left:22px;bottom:24px;width:138px;height:138px;border-radius:50%;background:#243f58a6;border:3px solid #ffffff75;touch-action:none;user-select:none;display:none;align-items:center;justify-content:center;box-sizing:border-box}#stick{width:58px;height:58px;border-radius:50%;background:#ffffffb9;border:2px solid #fff;box-sizing:border-box;transform:translate(0,0);pointer-events:none;box-shadow:0 3px 12px #0005}@media(pointer:coarse){#joystick{display:flex}}button{border:0;border-radius:12px;background:#263e56c9;color:white;font-size:22px;min-height:50px;touch-action:none}#jump{position:fixed;right:18px;bottom:18px;padding:0 18px}#hide{position:fixed;right:12px;top:12px;font-size:14px;padding:0 12px;min-height:36px}#hud.hidden{display:none}#studio-open{position:fixed;right:72px;top:12px;font-size:14px;min-height:36px;padding:0 12px}#studio{position:fixed;right:12px;top:58px;width:min(390px,calc(100vw - 24px));max-height:calc(100dvh - 80px);overflow:auto;box-sizing:border-box;background:#162c36f2;color:white;padding:16px;border-radius:16px;box-shadow:0 8px 30px #0005;z-index:10}#studio[hidden]{display:none}#avatar-preview{height:220px;border-radius:12px;background:linear-gradient(#8ec6e0,#d4e9dd);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:12px}#avatar-preview canvas{display:block;max-width:100%;height:100%}#studio .style-title{font-size:14px;font-weight:700;margin:14px 0 7px}#studio .style-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}#studio .style-option{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;min-height:66px;padding:5px 2px;background:#29485c;border:2px solid transparent;border-radius:10px}#studio .style-option[aria-pressed=true]{border-color:#fbd26e;background:#456b7a}#studio .style-option .symbol{font-size:25px}#studio h2{font-size:18px;margin:0 0 12px}#studio label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;margin:10px 0}#studio select{background:#29485c;color:white;border:1px solid #ffffff70;border-radius:8px;padding:8px;max-width:155px}#studio input[type=color]{width:62px;height:36px;padding:2px;background:transparent;border:1px solid #ffffff70;border-radius:8px}#studio .actions{display:flex;gap:8px;margin-top:12px}#studio .actions button{font-size:14px;min-height:40px;padding:0 12px;flex:1}@media(max-width:420px){#studio{top:54px}} #game-error{position:fixed;left:12px;right:12px;top:58px;z-index:100;background:#582c33;color:#fff;padding:12px;border-radius:10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}#game-error[hidden]{display:none}</style></head><body><div id="app"></div><div id="game-error" hidden role="alert"></div><div id="hud"><b>🌍 Custom World — Central World 3D</b><small>WASD / ลูกศร: เดิน · Shift: วิ่ง · Space: กระโดด<br>ลากเมาส์: หมุนกล้อง · ล้อเมาส์: ซูม<br>มือถือ: จอยสติ๊กซ้ายเดินแบบนุ่มนวล · ลากฉากเพื่อหมุนกล้อง</small><small id="pos"></small></div><button id="hide">HUD</button><button id="studio-open" aria-expanded="false" aria-controls="studio">🎨 แต่งตัว</button><section id="studio" hidden aria-label="Avatar Studio"><h2>🎨 Avatar Studio</h2><div id="avatar-preview" aria-label="ตัวอย่างตัวละคร 3D"></div><div class="style-title">ทรงผม — เลือกแบบ</div><div class="style-grid" id="hair-options"></div><div class="style-title">ชุด — เลือกแบบ</div><div class="style-grid" id="outfit-options"></div><label>สีผิว <input type="color" data-avatar="skin" value="#ffd3a0"></label><label>สีผม <input type="color" data-avatar="hair" value="#4a2e27"></label><label>สีเสื้อ <input type="color" data-avatar="shirt" value="#397bd5"></label><label>สีกางเกง <input type="color" data-avatar="pants" value="#334d8a"></label><label>สีรองเท้า <input type="color" data-avatar="shoes" value="#263247"></label><div class="actions"><button id="studio-reset">ค่าเริ่มต้น</button><button id="studio-close">ปิด</button></div><small>บันทึกสีอัตโนมัติในเครื่องนี้</small></section><div id="joystick" aria-label="จอยสติ๊กควบคุมการเดิน"><div id="stick"></div></div><button id="jump" data-key="Space">กระโดด</button><script>window.addEventListener('error',function(e){const box=document.querySelector('#game-error');box.hidden=false;box.textContent='เกมโหลดไม่สำเร็จ: '+(e.message||'โหลดไฟล์ไม่ได้')+'\nลองรีเฟรชหน้า หากยังเกิดปัญหาให้ส่งภาพหน้าจอนี้';});window.addEventListener('unhandledrejection',function(e){const box=document.querySelector('#game-error');box.hidden=false;box.textContent='เกิดข้อผิดพลาด: '+String(e.reason||'ไม่ทราบสาเหตุ');});</script><script type="module" src="/3d.js?v=14"></script></body></html>
