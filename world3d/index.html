<!doctype html><html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Custom World — 3D Central World</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#9ed8f3}#app{width:100%;height:100%}#hud{position:fixed;top:14px;left:14px;color:white;background:#162c36bd;padding:12px 16px;border-radius:12px;max-width:300px;pointer-events:none}#hud small{display:block;line-height:1.6}#touch{position:fixed;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,52px);gap:4px}button{border:0;border-radius:12px;background:#263e56c9;color:white;font-size:22px;min-height:50px;touch-action:none}#jump{position:fixed;right:18px;bottom:18px;padding:0 18px}#hide{position:fixed;right:12px;top:12px;font-size:14px;padding:0 12px;min-height:36px}#hud.hidden{display:none}</style></head><body><div id="app"></div><div id="hud"><b>🌍 Custom World — Central World 3D</b><small>WASD / ลูกศร: เดิน · Shift: วิ่ง · Space: กระโดด<br>ลากเมาส์: หมุนกล้อง · ล้อเมาส์: ซูม<br>มือถือ: ปุ่มเดิน + ลากฉากเพื่อหมุน</small><small id="pos"></small></div><button id="hide">HUD</button><div id="touch"><span></span><button data-key="KeyW">▲</button><span></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><button id="jump" data-key="Space">กระโดด</button><script type="module" src="/src/main.ts"></script></body></html>
